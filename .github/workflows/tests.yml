name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # torch и torchvision ставятся одной командой из CPU-индекса: собранные
      # порознь, они дают несовместимые бинарники и падают на регистрации
      # операторов (torchvision::nms does not exist)
      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ловит рассинхрон сборок понятной строкой, а не падением на сборе тестов
      - name: Verify torch/torchvision pairing
        run: |
          python -c "
          import torch, torchvision
          print('torch', torch.__version__, '| torchvision', torchvision.__version__)
          torchvision.ops.nms(torch.zeros(0, 4), torch.zeros(0), 0.5)
          print('binaries are compatible')
          "

      - name: Lint
        run: ruff check src scripts tests

      - name: Test
        run: pytest -q
