[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-detection"
version = "1.0.0"
description = "Сравнение свёрточных архитектур для детекции синтетических лиц на едином протоколе"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gleb Lebedkin" }]
keywords = ["deepfake", "computer-vision", "pytorch", "image-classification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "jupyter>=1.0",
]

[project.scripts]
deepfake-prepare = "scripts.prepare_data:main"
deepfake-train = "scripts.train:main"
deepfake-predict = "scripts.predict:main"
deepfake-report = "scripts.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
